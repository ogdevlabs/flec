[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flec"
version = "0.1.0"
description = "Flec — wearable superhero mask for toddler early learning"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# E9: syntax errors, F63x/F7xx/F8xx: pyflakes errors (undefined, unused, etc.)
# Deliberately narrow: style lint is a separate PR concern
select = ["E9", "F63", "F7", "F8"]
# F401: unused imports are common in lazy-import patterns; ignore in test files
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["F401", "F811", "F841"]
"scripts/**" = ["F401", "F841"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v"
markers = [
    "slow: marks tests as slow-running benchmarks (deselect with '-m not slow')",
]
